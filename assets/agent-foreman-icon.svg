<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="agent-foreman-mcp app icon">
  <title>agent-foreman-mcp</title>
  <desc>任务清单经派发后通过验收：编排中枢负责派活、验收与失败返修。</desc>
  <defs>
    <linearGradient id="af2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1550"/>
      <stop offset="58%" stop-color="#250d38"/>
      <stop offset="100%" stop-color="#12061f"/>
    </linearGradient>
    <linearGradient id="af2Warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb270"/>
      <stop offset="100%" stop-color="#ff5f8d"/>
    </linearGradient>
    <linearGradient id="af2Mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ef7c8"/>
      <stop offset="100%" stop-color="#2fd39b"/>
    </linearGradient>
    <linearGradient id="af2Row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7f1ff"/>
      <stop offset="100%" stop-color="#c9b6f0"/>
    </linearGradient>
    <radialGradient id="af2Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fb0" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff8fb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底色与内描边 -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#af2Bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#54297a" stroke-width="4"/>
  <circle cx="128" cy="112" r="96" fill="url(#af2Glow)"/>

  <!-- 任务清单：三条待办，长度递减表示已推进 -->
  <g fill="url(#af2Row)">
    <rect x="44" y="74" width="124" height="19" rx="9.5" opacity="0.95"/>
    <rect x="44" y="110" width="136" height="19" rx="9.5" opacity="0.66"/>
    <rect x="44" y="146" width="80" height="19" rx="9.5" opacity="0.38"/>
  </g>

  <!-- 派发箭头：把任务送出去 -->
  <g fill="none" stroke="url(#af2Warm)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M188 102 L218 102"/>
    <path d="M208 90 L222 102 L208 114"/>
  </g>

  <!-- 验收通过徽章：客观验收仪给出的结论 -->
  <g transform="translate(176 186)">
    <circle cx="0" cy="0" r="40" fill="url(#af2Mint)"/>
    <path d="M-17 1 L-5 14 L18 -13" fill="none" stroke="#0e2a20" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
